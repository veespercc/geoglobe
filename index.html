<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GeoGlobe 3D</title>
  
  <!-- Только единый автономный бандл Globe.gl со строгим HTTPS -->
  <script src="https://unpkg.com/globe.gl"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --success: #10b981;
      --danger: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    #globeViz {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Экран загрузки */
    .loader-screen {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      gap: 16px;
      transition: opacity 0.3s ease;
    }

    .loader-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
    }

    .progress-bar-wrap {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 20%;
      height: 100%;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    .loader-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Адаптивный SaaS интерфейс */
    .hud-container {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: calc(100% - 32px);
      max-width: 420px;
      pointer-events: none;
    }

    .saas-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px 18px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      background: var(--accent-glow);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .region-select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }

    .target-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #fff;
      line-height: 1.1;
    }

    .metrics-row {
      display: flex;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 8px 14px;
      border-radius: 12px;
    }

    .metric-col {
      display: flex;
      flex-direction: column;
    }

    .metric-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .metric-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    /* Мобильный Toast */
    .toast-pill {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 12px 18px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 90vw;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .toast-pill.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    .toast-pill.success { border-color: var(--success); }
    .toast-pill.error { border-color: var(--danger); }

    .toast-txt {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .btn-next-round {
      background: var(--accent);
      color: #040812;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .hud-container {
        top: auto;
        bottom: calc(16px + env(safe-area-inset-bottom));
        left: 16px;
        right: 16px;
        width: auto;
        transform: none;
      }

      .target-title {
        font-size: 1.35rem;
      }

      .toast-pill {
        top: 25%;
        transform: translate(-50%, 0);
      }
    }
  </style>
</head>
<body>

  <!-- Загрузчик -->
  <div id="loader" class="loader-screen">
    <div class="brand-title">
      <div class="brand-dot"></div>
      GeoGlobe 3D
    </div>
    <div class="progress-bar-wrap">
      <div id="pBar" class="progress-bar-fill"></div>
    </div>
    <div id="pText" class="loader-status">Инициализация планеты...</div>
  </div>

  <div id="globeViz"></div>

  <!-- HUD панель -->
  <div class="hud-container">
    <div class="saas-card">
      <div class="card-header">
        <span class="badge">Цель</span>
        <select id="regionSelect" class="region-select" onchange="changeRegion(this.value)">
          <option value="ALL">Весь мир 🌍</option>
          <option value="Europe">Европа 🇪🇺</option>
          <option value="Asia">Азия 🌏</option>
          <option value="Africa">Африка 🌍</option>
          <option value="Americas">Америка 🌎</option>
        </select>
      </div>

      <div id="targetName" class="target-title">Загрузка...</div>

      <div class="metrics-row">
        <div class="metric-col">
          <span class="metric-label">Очки</span>
          <span id="scoreVal" class="metric-val">0</span>
        </div>
        <div class="metric-col">
          <span class="metric-label">Серия</span>
          <span id="streakVal" class="metric-val" style="color: #f59e0b;">🔥 0</span>
        </div>
        <div class="metric-col">
          <span class="metric-label">Точность</span>
          <span id="accVal" class="metric-val">100%</span>
        </div>
      </div>

      <div class="card-actions">
        <button class="btn-secondary" onclick="skipCountry()">↻ Сменить страну</button>
        <button class="btn-secondary" id="soundBtn" onclick="toggleSound()">🔊 Звук</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast-pill">
    <span id="toastMsg" class="toast-txt">...</span>
    <button id="nextBtn" class="btn-next-round" style="display: none;" onclick="startNextRound()">Дальше →</button>
  </div>

  <script>
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;

    // --- ЗВУК ---
    let soundEnabled = true;
    let audioCtx = null;

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'win') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').innerText = soundEnabled ? '🔊 Звук' : '🔇 Звук';
    }

    // --- ЛОГИКА И ПЕРЕВОД ---
    let allCountries = [];
    let pool = [];
    let targetCountry = null;
    let score = 0;
    let streak = 0;
    let totalClicks = 0;
    let successClicks = 0;
    let isLocked = false;
    let world = null;

    const regionNamesRu = new Intl.DisplayNames(['ru'], { type: 'region' });
    const manualRu = {
      "France": "Франция", "Norway": "Норвегия", "Russia": "Россия",
      "United States of America": "США", "Somaliland": "Сомалиленд",
      "Kosovo": "Косово", "N. Cyprus": "Северный Кипр"
    };

    function getRuName(feat) {
      const p = feat.properties;
      const raw = p.NAME || p.ADMIN || p.NAME_LONG || 'Страна';
      if (manualRu[raw]) return manualRu[raw];
      let code = p.ISO_A2 !== '-99' ? p.ISO_A2 : (p.ISO_A2_EH || p.WB_A2);
      if (code && code !== '-99') {
        try { return regionNamesRu.of(code.toUpperCase()); } catch(e) {}
      }
      return raw;
    }

    function getCenter(feat) {
      if (!feat.bbox) {
        const c = feat.geometry.type === 'MultiPolygon' 
          ? feat.geometry.coordinates[0][0][0] 
          : feat.geometry.coordinates[0][0];
        return { lat: c[1], lng: c[0] };
      }
      return {
        lat: (feat.bbox[1] + feat.bbox[3]) / 2,
        lng: (feat.bbox[0] + feat.bbox[2]) / 2
      };
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2)**2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    // --- БЕЗОПАСНАЯ ИНИЦИАЛИЗАЦИЯ 3D ---
    const pBar = document.getElementById('pBar');
    const pText = document.getElementById('pText');

    try {
      pBar.style.width = '40%';
      pText.innerText = 'Создание 3D сцены...';

      world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
        .backgroundColor('#090d16')
        .atmosphereColor('#38bdf8')
        .atmosphereAltitude(isMobile ? 0.15 : 0.22)
        .lineHoverPrecision(0)
        .polygonAltitude(0.005)
        .polygonCapColor(() => 'rgba(255, 255, 255, 0.04)')
        .polygonSideColor(() => 'rgba(0, 0, 0, 0.2)')
        .polygonStrokeColor(() => 'rgba(255, 255, 255, 0.4)')
        .polygonLabel(d => `<div style="background: rgba(15,23,42,0.9); border: 1px solid rgba(255,255,255,0.15); color: #fff; font-weight: 600; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-family: sans-serif;">${getRuName(d)}</div>`)
        .onPolygonClick(handleSelection);

      // Безопасное подключение бампа только если десктоп
      if (!isMobile) {
        world.bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png');
      }
    } catch (err) {
      console.error('Ошибка инициализации Globe:', err);
    }

    // Загрузка GeoJSON через быстрый jsDelivr с резервом
    pBar.style.width = '70%';
    pText.innerText = 'Загрузка векторных карт...';

    const PRIMARY_GEOJSON = 'https://cdn.jsdelivr.net/gh/vasturiano/globe.gl@master/example/datasets/ne_110m_admin_0_countries.geojson';
    const FALLBACK_GEOJSON = 'https://unpkg.com/three-globe/example/datasets/ne_110m_admin_0_countries.geojson';

    function loadMapData(url) {
      return fetch(url)
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        });
    }

    loadMapData(PRIMARY_GEOJSON)
      .catch(() => loadMapData(FALLBACK_GEOJSON))
      .then(data => {
        allCountries = data.features.filter(d => (d.properties.NAME || d.properties.ADMIN) && d.properties.NAME !== 'Antarctica');
        pool = [...allCountries];

        if (world) {
          world.polygonsData(allCountries);
        }

        pBar.style.width = '100%';
        pText.innerText = 'Готово!';

        setTimeout(() => {
          document.getElementById('loader').classList.add('fade-out');
          pickNewTarget();
        }, 300);
      })
      .catch(err => {
        pText.innerText = 'Ошибка загрузки карты. Перезагрузите страницу.';
        console.error('Не удалось загрузить GeoJSON:', err);
      });

    // --- ГЕЙМПЛЕЙ ---
    function changeRegion(reg) {
      if (reg === 'ALL') {
        pool = [...allCountries];
      } else {
        pool = allCountries.filter(d => d.properties.CONTINENT === reg || d.properties.REGION_UN === reg);
        if (!pool.length) pool = [...allCountries];
      }
      pickNewTarget();
    }

    function pickNewTarget() {
      isLocked = false;
      hideToast();
      if (world) {
        world.ringsData([]);
        world.polygonCapColor(() => 'rgba(255, 255, 255, 0.04)');
      }

      if (!pool.length) return;
      targetCountry = pool[Math.floor(Math.random() * pool.length)];
      document.getElementById('targetName').innerText = getRuName(targetCountry);
    }

    function skipCountry() {
      if (isLocked) {
        startNextRound();
        return;
      }
      streak = 0;
      updateStats();
      pickNewTarget();
    }

    function handleSelection(clicked) {
      if (isLocked || !clicked || !targetCountry) return;

      totalClicks++;
      const clickedRu = getRuName(clicked);
      const targetRu = getRuName(targetCountry);
      const targetPos = getCenter(targetCountry);

      if (clicked === targetCountry) {
        isLocked = true;
        successClicks++;
        streak++;
        score += 100 + (streak > 1 ? (streak - 1) * 20 : 0);
        playSound('win');

        if (world) {
          world.polygonCapColor(d => d === clicked ? 'rgba(16, 185, 129, 0.75)' : 'rgba(255, 255, 255, 0.04)');
        }
        showToast(`Верно: ${targetRu}!`, 'success');

        setTimeout(() => {
          updateStats();
          pickNewTarget();
        }, 1400);

      } else {
        isLocked = true;
        streak = 0;
        playSound('error');

        const clickedPos = getCenter(clicked);
        const dist = getDistanceKm(clickedPos.lat, clickedPos.lng, targetPos.lat, targetPos.lng);

        if (world) {
          world.ringsData([{
            lat: targetPos.lat,
            lng: targetPos.lng,
            maxR: isMobile ? 6 : 8,
            propagationSpeed: 3.5,
            repeatPeriod: 750
          }])
          .ringColor(() => '#f43f5e')
          .ringMaxRadius('maxR')
          .ringPropagationSpeed('propagationSpeed')
          .ringRepeatPeriod('repeatPeriod');

          world.polygonCapColor(d => d === targetCountry ? 'rgba(244, 63, 94, 0.6)' : 'rgba(255, 255, 255, 0.04)');
          world.pointOfView({ lat: targetPos.lat, lng: targetPos.lng, altitude: isMobile ? 2.1 : 1.8 }, 1200);
        }

        showToast(`Это ${clickedRu}. До цели: ${dist.toLocaleString()} км.`, 'error', true);
      }
      updateStats();
    }

    function updateStats() {
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('streakVal').innerText = `🔥 ${streak}`;
      const acc = totalClicks > 0 ? Math.round((successClicks / totalClicks) * 100) : 100;
      document.getElementById('accVal').innerText = `${acc}%`;
    }

    function showToast(msg, type, showBtn = false) {
      const t = document.getElementById('toast');
      const tm = document.getElementById('toastMsg');
      const nb = document.getElementById('nextBtn');
      tm.innerText = msg;
      t.className = `toast-pill show ${type}`;
      nb.style.display = showBtn ? 'inline-block' : 'none';
    }

    function hideToast() {
      document.getElementById('toast').className = 'toast-pill';
    }

    function startNextRound() {
      pickNewTarget();
    }

    window.addEventListener('resize', () => {
      if (world) world.width(window.innerWidth).height(window.innerHeight);
    });
  </script>
</body>
</html>
